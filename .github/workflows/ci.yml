name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: api (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB_TEST: mokhotsi_ci
      REDIS_URL_TEST: redis://localhost:6379/15
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-000000
    steps:
      - uses: actions/checkout@v7
      # Service containers cannot take arguments, and transactions need a replica set, so
      # MongoDB is started here as a single-node replica set (same as docker-compose.yml).
      - name: Start MongoDB replica set
        working-directory: .
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval \
            "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true && break
            sleep 2
          done
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # `CI=true` (set by GitHub) makes Mongo/Redis-dependent tests fail instead of skip.
      - run: uv run pytest

  mobile:
    name: mobile (tsc + eslint + prettier + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false # .tflite models are not needed to type-check, lint or test.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci # postinstall regenerates src/ml/modelAssets.generated.ts
      - run: npm run typecheck # app (no Node types) + tests (Node types)
      - run: npx expo lint
      - run: npm run format:check
      - run: npx jest --ci

  ml:
    name: ml (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: ml/uv.lock
      # Only the dev group (ruff): TensorFlow/Ultralytics are not needed to lint.
      - run: uv sync --locked --only-dev
      - run: uv run --only-dev ruff check .
      - run: uv run --only-dev ruff format --check .
      - run: uv run --only-dev python scripts/export_detector.py --help
