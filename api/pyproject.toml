[project]
name = "mokhotsi-api"
version = "0.1.0"
description = "Mokhotsi sync and backup API (FastAPI + MongoDB). Never in the checkout path."
authors = [
    { name = "2Lebelo", email = "lebelorethabile21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymongo>=4.18.2",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.uv]
# An application, not a library: no build backend, `app/` is imported from the project root.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 100; allow longer TODO(feature)/doc comments up to 120.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
