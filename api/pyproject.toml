[project]
name = "mokhotsi-api"
version = "0.1.0"
description = "Mokhotsi sync and backup API (FastAPI + MongoDB). Never in the checkout path."
authors = [
    { name = "2Lebelo", email = "lebelorethabile21@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cloudinary>=1.44",
    "fastapi[standard]>=0.142.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pymongo>=4.18.2",
    "redis>=6.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

# `uv sync` installs `app/` into the venv (editable), so it imports from any working directory.
[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 100; allow longer TODO(feature)/doc comments up to 120.
max-line-length = 120

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
