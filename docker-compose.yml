# Local development: MongoDB + the API.
#   docker compose up --build        → API on http://localhost:8000 (docs at /docs)
# Needs api/.env (copy api/.env.example). MONGO_URI is overridden below for the container network.
# If a local MongoDB already uses port 27017, set MONGO_HOST_PORT=27018 (env or root .env file).
name: mokhotsi

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: ./api
    restart: unless-stopped
    env_file:
      - path: ./api/.env
        required: true
    environment:
      MONGO_URI: mongodb://mongo:27017
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
